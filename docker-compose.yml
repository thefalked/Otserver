# Standalone / local compose for this repo.
# Production + Traefik wrapper: home-server/otserver/docker-compose.yml
# Keep service definitions, SQL mounts, and ports in sync with that file.
# Do not run this stack and the home-server wrapper at the same time.
#
# Public ports are on nginx (HTTP) and otserver (OT TCP).
#   127.0.0.1:8080 HTTP site (localhost only — H3) | 7171/7172 game
# VPS overlay (docker-compose.vps.yml) also publishes 80/443.
# Clients: set OT_IP in .env to the hostname/IP clients should use after login.

services:
  mysql:
    image: mysql:8.4
    container_name: otserver-mysql
    restart: unless-stopped
    command:
      [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
        "--sql-mode=NO_ENGINE_SUBSTITUTION",
        "--log-bin-trust-function-creators=1",
      ]
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/schemas/mysql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docker/mysql/02-custom.sql:/docker-entrypoint-initdb.d/02-custom.sql:ro
      - ./docker/mysql/03-gesior.sql:/docker-entrypoint-initdb.d/03-gesior.sql:ro
      - ./docker/mysql/06-gesior-player-cols.sql:/docker-entrypoint-initdb.d/06-gesior-player-cols.sql:ro
      - ./docker/mysql/07-lottery.sql:/docker-entrypoint-initdb.d/07-lottery.sql:ro
      - ./docker/mysql/08-god-energy.sql:/docker-entrypoint-initdb.d/08-god-energy.sql:ro
      - ./docker/mysql/09-hide-sample-chars.sql:/docker-entrypoint-initdb.d/09-hide-sample-chars.sql:ro
      - ./docker/mysql/10-a2-account-manager.sql:/docker-entrypoint-initdb.d/10-a2-account-manager.sql:ro
    mem_limit: 4g
    memswap_limit: 4g
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 60s
    networks:
      - otnet

  # Compiles TFS inside the image for the host arch (see server/Dockerfile).
  # H7: entrypoint drops to user otserver (uid 1000) after render-config.
  otserver:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: otserver
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    working_dir: /ot
    env_file: .env
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      OT_IP: ${OT_IP}
      CONFIG_TEMPLATE: /ot/config.lua.template
      CONFIG_OUT: /ot/config.lua
    volumes:
      - ./server/config.lua.template:/ot/config.lua.template:ro
      - ./server/data:/ot/data
      - ./server/mods:/ot/mods
      - ./docker/render-config.sh:/usr/local/bin/render-config.sh:ro
      - ot_logs:/ot/logs
    # Publish login/game on the host directly. If nginx streams these, TFS sees
    # the proxy's Docker IP and the charlist advertises 172.x (client times out).
    ports:
      - "7171:7171"
      - "7172:7172"
    mem_limit: 6g
    memswap_limit: 6g
    networks:
      - otnet

  # GesiorACC — account maker / downloads site
  website:
    build:
      context: .
      dockerfile: website/Dockerfile
    container_name: otserver-website
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    # H4: no env_file — do not inject MYSQL_ROOT_PASSWORD / unrelated secrets.
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      OT_IP: ${OT_IP}
      CONFIG_TEMPLATE: /ot/config.lua.template
      CONFIG_OUT: /ot/config.lua
    volumes:
      # H6: PHP sources :ro so RCE cannot rewrite forum.php etc.; writable dirs remounted RW.
      - ./website:/var/www/html:ro
      - ./website/cache:/var/www/html/cache
      - ./website/guilds:/var/www/html/guilds
      - ./website/images/head:/var/www/html/images/head
      - ./website/bdsave:/var/www/html/bdsave
      - ./website/config:/var/www/html/config
      - ./server/config.lua.template:/ot/config.lua.template:ro
      - ./server/data:/ot/data:ro
      - ./docker/render-config.sh:/usr/local/bin/render-config.sh:ro
      - ./website/docker-entrypoint.sh:/usr/local/bin/website-entrypoint.sh:ro
    expose:
      - "80"
    mem_limit: 2g
    memswap_limit: 2g
    networks:
      - otnet
    # No in-container HTTP probe: php:apache image has no curl/wget.

  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: otserver-nginx
    restart: unless-stopped
    depends_on:
      - website
      - otserver
    # H4: only domain/IP vars — no MySQL secrets.
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      SITE_MAINTENANCE_DOMAIN: ${SITE_MAINTENANCE_DOMAIN:-}
      SITE_DOMAIN_ALIASES: ${SITE_DOMAIN_ALIASES:-}
      OT_IP: ${OT_IP}
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs
      - ./docker/nginx/acme:/var/www/certbot:ro
    ports:
      # H3: cleartext AAC only on loopback (public HTTPS is 80/443 via vps overlay).
      - "127.0.0.1:${WEBSITE_PORT:-8080}:8080"
      # 7171/7172 are on otserver (not nginx) so charlist gets the real client IP
    mem_limit: 256m
    memswap_limit: 256m
    networks:
      - otnet

networks:
  otnet:

volumes:
  mysql_data:
  ot_logs:

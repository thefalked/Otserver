# Placeholder so nginx -t works before entrypoint rewrites this file.
# Generated at container start by docker/nginx/entrypoint.sh.
map $ssl_preread_server_name $hawser_backend {
    default "";
}

server {
    listen 2376;
    ssl_preread on;
    proxy_pass $hawser_backend;
    proxy_connect_timeout 5s;
    proxy_timeout 1h;
}

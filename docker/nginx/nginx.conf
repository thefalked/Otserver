user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;
    client_max_body_size 16m;
    proxy_http_version 1.1;

    # HTTP → HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Existing WEBSITE_PORT (8080) — HTTP reverse proxy to Gesior
    server {
        listen 8080;
        server_name _;

        location / {
            proxy_pass http://website:80;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Website over TLS (self-signed cert generated at container start)
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_timeout 1d;
        ssl_session_cache   shared:SSL:10m;

        location / {
            proxy_pass http://website:80;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

# Raw OT protocol (not HTTP). TFS 0.4 does not speak PROXY protocol.
stream {
    log_format ot '$remote_addr [$time_local] $protocol $status $bytes_sent $bytes_received $session_time';
    access_log /var/log/nginx/ot-stream.log ot;

    server {
        listen 7171;
        proxy_pass otserver:7171;
        proxy_connect_timeout 10s;
        proxy_timeout 24h;
    }

    server {
        listen 7172;
        proxy_pass otserver:7172;
        proxy_connect_timeout 10s;
        proxy_timeout 24h;
    }
}

# Reverse proxy in front of the compose stack.
#
# Why nginx at all: UFW + a single public process for the *website*.
# OT login/game (7171/7172) are published directly on the otserver service:
# if nginx TCP-streams them, TFS sees the proxy Docker IP and the charlist
# advertises 172.x to the client (connect timeout after character select).
#
# http { }  — website traffic (80/443/8080 → service "website" port 80)
# stream { } — kept unused on host ports; left for optional internal use.
#
# Upstream names use variables + Docker's embedded DNS (127.0.0.11) so nginx
# can start/reload while otserver or website are still coming up. A bare
# `proxy_pass otserver:7171` is resolved at config-load and fails with
# "host not found in upstream" during first boot / certbot deploy hooks.
#
# Host publish: docker-compose.yml maps 8080/7171/7172.
# docker-compose.vps.yml also maps 80/443 (used by scripts/setup-vps.sh).
# Port 80 serves Let's Encrypt HTTP-01 then redirects everything else to HTTPS.
#
# HTTPS server blocks live in /etc/nginx/certs/https-servers.conf (written by
# entrypoint / install-letsencrypt-certs.sh) so public and maintenance domains
# can use separate certificates (no shared SANs in CT logs).

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;           # hide nginx version from response headers
    client_max_body_size 16m;    # Gesior can post images; default 1m is tight
    proxy_http_version 1.1;

    # Docker Compose DNS. valid= refreshes after containers restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # VPS: ACME HTTP-01 must be served on :80 *before* the HTTPS redirect,
    # or Let's Encrypt cannot issue/renew. Other HTTP is sent to 443.
    # Harmless if 80 is not published locally.
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Same URL as before the proxy existed (WEBSITE_PORT, default 8080).
    # Stays HTTP so local compose and old bookmarks keep working.
    server {
        listen 8080;
        server_name _;

        location / {
            set $website_upstream website:80;
            proxy_pass http://$website_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # F2: do not forward upstream Apache/PHP identity to clients
            proxy_hide_header Server;
            proxy_hide_header X-Powered-By;
        }
    }

    # Primary + optional maintenance HTTPS (separate cert files).
    include /etc/nginx/certs/https-servers.conf;
}

stream {
    # Same Docker DNS as http — required for variable proxy_pass in stream.
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format ot '$remote_addr [$time_local] $protocol $status $bytes_sent $bytes_received $session_time';
    access_log /var/log/nginx/ot-stream.log ot;

    # Login port. proxy_timeout is long because clients stay connected.
    server {
        listen 7171;
        set $ot_login otserver:7171;
        proxy_pass $ot_login;
        proxy_connect_timeout 10s;
        proxy_timeout 24h;
    }

    # Game port. Same long timeout — a 10m default would drop idle players.
    server {
        listen 7172;
        set $ot_game otserver:7172;
        proxy_pass $ot_game;
        proxy_connect_timeout 10s;
        proxy_timeout 24h;
    }
}

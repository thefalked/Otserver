# Reverse proxy in front of the compose stack.
#
# Why nginx at all: UFW + a single public process. The Gesior Apache container
# and the OT daemon stay on the Docker network; only this container binds host
# ports.
#
# http { }  — website traffic (80/443/8080 → service "website" port 80)
# stream { } — raw OT TCP (7171/7172 → service "otserver"). This is NOT HTTP.
#              TFS 0.4 does not understand PROXY protocol, so we do not enable it.
#
# Host publish: docker-compose.yml maps 8080/7171/7172.
# docker-compose.vps.yml also maps 80/443 (used by scripts/setup-vps.sh).

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;           # hide nginx version from response headers
    client_max_body_size 16m;    # Gesior can post images; default 1m is tight
    proxy_http_version 1.1;

    # VPS: send everyone on :80 to HTTPS. Harmless if 80 is not published locally.
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Same URL as before the proxy existed (WEBSITE_PORT, default 8080).
    # Stays HTTP so local compose and old bookmarks keep working.
    server {
        listen 8080;
        server_name _;

        location / {
            proxy_pass http://website:80;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS for the site. Cert files come from docker/nginx/certs (created by
    # setup-vps.sh or by docker/nginx/entrypoint.sh on first start).
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_timeout 1d;
        ssl_session_cache   shared:SSL:10m;

        location / {
            proxy_pass http://website:80;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

stream {
    log_format ot '$remote_addr [$time_local] $protocol $status $bytes_sent $bytes_received $session_time';
    access_log /var/log/nginx/ot-stream.log ot;

    # Login port. proxy_timeout is long because clients stay connected.
    server {
        listen 7171;
        proxy_pass otserver:7171;
        proxy_connect_timeout 10s;
        proxy_timeout 24h;
    }

    # Game port. Same long timeout — a 10m default would drop idle players.
    server {
        listen 7172;
        proxy_pass otserver:7172;
        proxy_connect_timeout 10s;
        proxy_timeout 24h;
    }
}
